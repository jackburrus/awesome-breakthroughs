  - https://arxiv.org/abs/2606.10402
maintainer: Federico Bianchi, Yongchan Kwon, Aneesh Pappu, James Zou and collaborators
description: Agent-native platform with open math construction problems, a public Python verifier per problem, live leaderboards and discussion threads.
field: mathematics
