ai_records:
  - summary: The Core in Approval-Based Committee Elections (a Major advance problem) solved by Becker, Greger and Peters with GPT-6 Astra in a long interactive session.
    date: 2026-09-16
    system: GPT-6 Astra
    level: source-accepted
    autonomy: human+ai
    evidence:
      - https://epoch.ai/frontiermath/open-problems/committee-election
    notes: The authors credit the main idea and proof to the model. Epoch marks it human + AI because the model did not solve it from a simple prompt. The date is when Epoch published the human + AI label.
  - summary: Hadamard matrix of order 668 solved, reported by an Anthropic researcher crediting three humans and Claude.
    date: 2026-08-12
    system: Claude (internal Anthropic model)
    level: source-accepted
    autonomy: human+ai
    evidence:
      - https://epoch.ai/frontiermath/open-problems/hadamard
    notes: First marked solved by AI on 2026-08-12, then labelled human + AI under the 2026-09-16 policy change.
last_updated: 2026-09-16
last_checked: 2026-09-23
lifecycle: active
tractability:
  level: medium
