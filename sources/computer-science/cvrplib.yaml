id: cvrplib
name: CVRPLIB
url: https://galgos.inf.puc-rio.br/cvrplib/index.php/en/
maintainer: Galgos, PUC-Rio (site maintained by Rafael Martinelli)
description: Capacitated vehicle routing instances with best known solutions, a solution checker, and a log of every improvement.
field: computer-science
subfield: [combinatorial-optimization]
granularity: record-table
size:
  note: Sets A, B, E, F, M, P, CMT, Golden, Li, X (100 instances), XML (10,000), XL (100 instances with 1,000 to 10,000 customers, 2026), DIMACS and AGS, plus VRPTW sets.
  as_of: 2026-09-23
verification: [bound]
verifier_access: public-service
status_tracking: per-problem
submission: [email]
access: open
ai_records:
  - summary: Seventy improved best known solutions on the XL set, reported by the Famou Agent Team (Baidu AI Cloud) and accepted by CVRPLIB.
    date: 2026-09-11
    system: Famou Agent (Baidu AI Cloud)
    level: source-accepted
    autonomy: unknown
    evidence:
      - https://galgos.inf.puc-rio.br/cvrplib/index.php/en/updates/
    notes: CVRPLIB checked and accepted the solutions. The update names the team, not the method; Famou is Baidu's self-evolving optimization agent.
last_updated: 2026-09-11
last_checked: 2026-09-23
lifecycle: active
tractability:
  level: high
  rationale: Any improved solution is checked automatically, and the large XL instances are beyond exact methods.
contamination_risk: low
notes: Anyone can submit improved solutions; the site lists galgos@inf.puc-rio.br as its contact and has a solution checker. Claims of optimality need a citable reference for the method. The 2026 BKS Challenge on the XL set produced 1,932 improved solutions. The older vrp.galgos URL is outdated.
