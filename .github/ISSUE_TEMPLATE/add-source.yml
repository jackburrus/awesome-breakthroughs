name: Add a source
description: Suggest a source of open problems with a stated way to check solutions.
title: "Add source: "
labels: ["add-source"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a source. Please fill in what you checked yourself, and say when you checked it.
        See [CONTRIBUTING.md](https://github.com/jackburrus/awesome-breakthroughs/blob/main/CONTRIBUTING.md) for what belongs in the list.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: Field
      options:
        - mathematics
        - computer-science
        - physics-astronomy
        - biology-medicine
        - chemistry-materials
        - earth-climate-energy
        - ai-ml
        - meta
    validations:
      required: true
  - type: input
    id: maintainer
    attributes:
      label: Maintainer
      description: Who runs the source.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: One plain sentence, 200 characters or less.
    validations:
      required: true
  - type: dropdown
    id: granularity
    attributes:
      label: Kind of source
      options:
        - single-problem
        - database
        - record-table
        - benchmark
        - competition
        - platform
        - meta-list
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: How solutions are checked
      options:
        - label: formal (proof assistant such as Lean or Rocq)
        - label: score (automatic scoring function)
        - label: bound (numeric record with a checker)
        - label: review (human referee or editor)
        - label: blind (held-out data, future data or wet lab)
        - label: self-reported (no independent check)
  - type: dropdown
    id: verifier_access
    attributes:
      label: Can you run the check yourself?
      options:
        - public-code
        - public-service
        - gated-free (free after registration)
        - paid
        - none (a person decides)
    validations:
      required: true
  - type: input
    id: submission
    attributes:
      label: How to submit a solution
      placeholder: pull request, forum, email, API, leaderboard upload...
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Size, with the date you counted it
      placeholder: 1,221 problems as of 2026-09-23
    validations:
      required: true
  - type: textarea
    id: ai_claims
    attributes:
      label: AI claims (optional)
      description: Any claim that an AI system made progress here, with links. Say whether the source's maintainer has accepted it and whether anyone disputes it.
  - type: input
    id: last_checked
    attributes:
      label: Date you checked the URL and facts
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I opened the URL and confirmed the facts above on the date given.
          required: true
        - label: Each problem has a precise statement and the source says how solutions are checked.
          required: true
