id: oeis-open
name: OEIS Open
url: https://github.com/epoch-research/LeanOpenProblems
maintainer: Epoch AI (Tom Adamczewski)
description: Open-source harness that runs any language model on 492 Lean-formalized OEIS conjectures, plus a 100-problem Lite subset.
field: mathematics
subfield: [number-theory, formal-statements]
granularity: benchmark
size:
  total: 492
  unit: conjectures
  as_of: 2026-08-13
  note: OEIS Open Lite is a random subset of 100. The conjectures come from the AlphaProof Nexus OEIS set.
verification: [formal]
proof_assistant: lean4
verifier_access: public-code
status_tracking: per-problem
submission: [self-run]
access: open
license: MIT
ai_records:
  - summary: Language models with minimal tools resolved 147 of the 492 conjectures at a budget of $50 per attempt; the best model scored 44% on Lite at $200 per attempt.
    date: 2026-08-12
    system: Several frontier language models
    level: machine-checked
    autonomy: autonomous
    disclosure: [denominator, cost]
    evidence:
      - https://arxiv.org/abs/2608.11941
last_updated: 2026-09-23
last_checked: 2026-09-23
lifecycle: active
tractability:
  level: high
  rationale: Cheap automatic Lean check, and the author reports many conjectures fall at modest cost.
contamination_risk: low
notes: The author says these conjectures are of uncertain mathematical significance and most have received little attention. The repository has no README yet; see the paper for usage.
